name: Run Tests (ruff, pylint, mypy, pytest)

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "20 10 * * SUN"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Depth of 2 suggested by codecov.io
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Sync dependencies
        # --no-build to avoid security alerts
        # --no-install-project so that we don't attempt to build the project, which would fail
        #   because of --no-build. And we don't need the project anyway cause we just need
        #   dev dependencies (tools) for linting.
        run: uv sync --frozen --no-build --no-install-project --group dev

      - name: Ruff
        run: uv run --no-build --no-project ruff check .

      - name: Pylint
        run: uv run --no-build --no-project pylint src

      - name: MyPy
        run: uv run --no-build --no-project mypy src

      - name: Test with pytest, generating a coverage report and test analytics (for codecov.io)
        # coverage: pytest --cov --cov-branch --cov-report=xml
        # testa analytics: pytest --cov --junitxml=junit.xml -o junit_family=legacy
        run: |
          # Build the project for pytest (because we had `uv sync --no-install-project`
          # and `uv run --no-project` earlier)
          uv pip install -e .
          # Run pytest
          uv run --no-build --no-project pytest --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
